name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      artifact-metadata: write
      contents: read
      packages: write
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required for Nerdbank.GitVersioning

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - uses: dotnet/nbgv@v0.5
        id: nbgv

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release /p:ContinuousIntegrationBuild=true

      - name: Pack
        run: dotnet pack src/TUnit.PairwiseDataSource -c Release -o ./artifacts /p:ContinuousIntegrationBuild=true

      # Builds the example against the package packed above, the same way consumers get it.
      - name: Run examples/TunitPairwiseShowcase
        run: |
          dotnet restore examples/TunitPairwiseShowcase --source ./artifacts --source https://api.nuget.org/v3/index.json
          dotnet run --project examples/TunitPairwiseShowcase --no-restore

      - name: Upload NuGet package
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg

      - name: Push to GitHub Packages
        if: github.ref_name == github.event.repository.default_branch || github.ref_type == 'tag'
        run: dotnet nuget push ./artifacts/*.nupkg --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate

      - uses: actions/attest@v4
        if: github.ref_name == github.event.repository.default_branch || github.ref_type == 'tag'
        with:
          subject-path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
